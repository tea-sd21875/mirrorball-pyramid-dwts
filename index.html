<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mirrorball Pyramid</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px 60px;
  background: #000;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

h1 {
  font-size: 42px;
  margin: 10px 0 5px;
}

.subtitle {
  color: #ccc;
  margin-bottom: 10px;
}

.instructions {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 30px;
}

/* -----------------------
   PYRAMID
----------------------- */

.pyramid {
  max-width: 1050px;
  margin: 0 auto 45px;
}

.pyramid-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 12px;
}

/* -----------------------
   RANKING SLOT
----------------------- */

.rank-slot {
  width: 145px;
  min-height: 205px;

  border: 2px dashed #777;
  background: #111;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.rank-slot:hover {
  border-color: white;
}

.rank-number {
  position: absolute;
  top: 5px;
  left: 7px;

  font-size: 16px;
  font-weight: bold;

  background: black;
  padding: 2px 6px;

  z-index: 5;
}

.rank-slot.selected-slot {
  outline: 3px solid white;
}

/* -----------------------
   COUPLE CARDS
----------------------- */

.couple-card {
  width: 135px;

  background: #111;
  border: 2px solid silver;

  padding: 5px;

  cursor: grab;

  box-shadow: 3px 3px 0 #555;

  user-select: none;
}

.couple-card:active {
  cursor: grabbing;
}

.couple-card.selected {
  outline: 4px solid white;
}

.couple-card img {
  width: 100%;
  height: 155px;

  object-fit: cover;

  display: block;

  pointer-events: none;
}

.couple-name {
  font-size: 13px;
  font-weight: bold;

  padding: 6px 2px 2px;

  text-transform: uppercase;
}

/* Cards inside pyramid */

.rank-slot .couple-card {
  width: 135px;
  box-shadow: none;
}

/* -----------------------
   UNRANKED
----------------------- */

.unranked-section {
  max-width: 1100px;

  margin: auto;

  border-top: 2px solid #777;

  padding-top: 25px;
}

.unranked-section h2 {
  font-size: 20px;
  letter-spacing: 2px;
}

.unranked {
  display: flex;
  flex-wrap: wrap;

  justify-content: center;

  gap: 14px;

  min-height: 200px;

  padding: 15px;
}

/* -----------------------
   BUTTONS
----------------------- */

.controls {
  margin: 25px 0;
}

button {
  background: #ddd;
  color: black;

  border-top: 3px solid white;
  border-left: 3px solid white;
  border-right: 3px solid #555;
  border-bottom: 3px solid #555;

  padding: 10px 20px;

  font-weight: bold;

  cursor: pointer;

  margin: 5px;
}

button:active {
  border-top: 3px solid #555;
  border-left: 3px solid #555;
  border-right: 3px solid white;
  border-bottom: 3px solid white;
}

/* -----------------------
   MOBILE
----------------------- */

@media (max-width: 700px) {

  h1 {
    font-size: 28px;
  }

  .pyramid-row {
    gap: 4px;
  }

  .rank-slot {
    width: 23vw;
    min-height: 145px;
  }

  .rank-slot .couple-card {
    width: 100%;
  }

  .rank-slot .couple-card img {
    height: 105px;
  }

  .rank-slot .couple-name {
    font-size: 9px;
  }

  .rank-number {
    font-size: 11px;
  }

}

</style>
</head>


<body>

<h1>🪩 MIRRORBALL PYRAMID 🪩</h1>

<div class="subtitle">
  ~* rank the stars • build your pyramid *~
</div>

<div class="instructions">
  Drag couples into the pyramid — or tap a couple, then tap a position.
</div>

<!-- ACCOUNT AREA -->

<div id="authArea" style="margin: 20px auto 30px; max-width: 500px;">

  <div id="loggedOutArea">

    <input
      id="emailInput"
      type="email"
      placeholder="Email"
      style="padding:10px; margin:4px; width:200px;"
    >

    <input
      id="passwordInput"
      type="password"
      placeholder="Password"
      style="padding:10px; margin:4px; width:200px;"
    >

    <br>

    <button id="signUpButton">
      SIGN UP
    </button>

    <button id="loginButton">
      LOG IN
    </button>

  </div>


  <div id="loggedInArea" style="display:none;">

    <div>
      ★ LOGGED IN AS
      <strong id="userEmail"></strong> ★
    </div>

    <button id="logoutButton">
      LOG OUT
    </button>

  </div>

  <div
    id="authMessage"
    style="margin-top:10px; font-size:13px;"
  ></div>

</div>
<!-- PYRAMID -->

<div class="pyramid">

  <div class="pyramid-row">
    <div class="rank-slot" data-rank="1">
      <span class="rank-number">#1</span>
    </div>
  </div>

  <div class="pyramid-row">
    <div class="rank-slot" data-rank="2">
      <span class="rank-number">#2</span>
    </div>

    <div class="rank-slot" data-rank="3">
      <span class="rank-number">#3</span>
    </div>
  </div>

  <div class="pyramid-row">
    <div class="rank-slot" data-rank="4">
      <span class="rank-number">#4</span>
    </div>

    <div class="rank-slot" data-rank="5">
      <span class="rank-number">#5</span>
    </div>

    <div class="rank-slot" data-rank="6">
      <span class="rank-number">#6</span>
    </div>
  </div>

  <div class="pyramid-row">
    <div class="rank-slot" data-rank="7">
      <span class="rank-number">#7</span>
    </div>

    <div class="rank-slot" data-rank="8">
      <span class="rank-number">#8</span>
    </div>

    <div class="rank-slot" data-rank="9">
      <span class="rank-number">#9</span>
    </div>

    <div class="rank-slot" data-rank="10">
      <span class="rank-number">#10</span>
    </div>
  </div>

  <div class="pyramid-row">
    <div class="rank-slot" data-rank="11">
      <span class="rank-number">#11</span>
    </div>

    <div class="rank-slot" data-rank="12">
      <span class="rank-number">#12</span>
    </div>

    <div class="rank-slot" data-rank="13">
      <span class="rank-number">#13</span>
    </div>

    <div class="rank-slot" data-rank="14">
      <span class="rank-number">#14</span>
    </div>
  </div>

</div>


<div class="controls">

  <button id="saveButton">
    💾 SAVE MY PYRAMID
  </button>

  <button id="resetButton">
    RESET PYRAMID
  </button>

  <div
    id="saveMessage"
    style="margin-top:10px; font-size:14px;"
  ></div>

</div>


<!-- UNRANKED COUPLES -->

<div class="unranked-section">

  <h2>★ UNRANKED COUPLES ★</h2>

  <div id="unranked" class="unranked">

    Loading couples...

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://uyqstzngztwurfdqmdww.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HUh6Oe9R3R_PQv2nqgzcZw_RnM8Pk8B";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const unranked =
document.getElementById("unranked");

const slots =
document.querySelectorAll(".rank-slot");

let draggedCard = null;

let selectedCard = null;


/* -----------------------
   LOAD COUPLES
----------------------- */

async function loadCouples() {

  const { data, error } =
    await supabaseClient
      .from("couples")
      .select("*")
      .order("id");


  if (error) {

    console.error(error);

    unranked.innerHTML =
      "Could not load couples.";

    return;
  }


  unranked.innerHTML = "";


  data.forEach(couple => {

    const card =
      createCoupleCard(couple);

    unranked.appendChild(card);

  });

}


/* -----------------------
   CREATE CARD
----------------------- */

function createCoupleCard(couple) {

  const card =
    document.createElement("div");

  card.className =
    "couple-card";

  card.draggable = true;

  card.dataset.coupleId =
    couple.id;


  card.innerHTML = `

    <img
      src="${couple.image_url}"
      alt="${couple.celebrity_name} and ${couple.pro_name}"
    >

    <div class="couple-name">
      ${couple.celebrity_name}
      +
      ${couple.pro_name}
    </div>

  `;


  /* DRAG */

  card.addEventListener(
    "dragstart",
    () => {

      draggedCard = card;

    }
  );


  card.addEventListener(
    "dragend",
    () => {

      draggedCard = null;

    }
  );


  /* CLICK / TAP */

  card.addEventListener(
    "click",
    (event) => {

      event.stopPropagation();

      selectCard(card);

    }
  );


  return card;

}


/* -----------------------
   SELECT CARD
----------------------- */

function selectCard(card) {

  if (selectedCard) {

    selectedCard.classList.remove(
      "selected"
    );

  }


  if (selectedCard === card) {

    selectedCard = null;

    return;

  }


  selectedCard = card;

  card.classList.add(
    "selected"
  );

}


/* -----------------------
   PYRAMID SLOTS
----------------------- */

slots.forEach(slot => {


  slot.addEventListener(
    "dragover",
    event => {

      event.preventDefault();

    }
  );


  slot.addEventListener(
    "drop",
    event => {

      event.preventDefault();

      if (!draggedCard) return;

      moveCardToSlot(
        draggedCard,
        slot
      );

    }
  );


  slot.addEventListener(
    "click",
    () => {

      if (!selectedCard) return;

      moveCardToSlot(
        selectedCard,
        slot
      );

    }
  );


});


/* -----------------------
   MOVE / SWAP
----------------------- */

function moveCardToSlot(
  card,
  slot
) {

  const existingCard =
    slot.querySelector(
      ".couple-card"
    );


  const oldParent =
    card.parentElement;


  /*
    If another couple already
    occupies this rank,
    swap the two cards.
  */

  if (
    existingCard &&
    existingCard !== card
  ) {

    if (
      oldParent.classList.contains(
        "rank-slot"
      )
    ) {

      oldParent.appendChild(
        existingCard
      );

    } else {

      unranked.appendChild(
        existingCard
      );

    }

  }


  slot.appendChild(card);


  if (selectedCard) {

    selectedCard.classList.remove(
      "selected"
    );

  }

  selectedCard = null;

}


/* -----------------------
   DROP BACK INTO UNRANKED
----------------------- */

unranked.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

  }
);


unranked.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    if (!draggedCard) return;

    unranked.appendChild(
      draggedCard
    );

  }
);


/* -----------------------
   RESET
----------------------- */

document
  .getElementById("resetButton")
  .addEventListener(
    "click",
    () => {

      const cards =
        document.querySelectorAll(
          ".couple-card"
        );


      cards.forEach(card => {

        card.classList.remove(
          "selected"
        );

        unranked.appendChild(
          card
        );

      });


      selectedCard = null;

    }
  );


loadCouples();



/* -----------------------
   AUTO SCROLL WHILE DRAGGING
----------------------- */

let autoScrollSpeed = 0;
let autoScrollAnimation = null;

function runAutoScroll() {

  if (autoScrollSpeed !== 0) {
    window.scrollBy(0, autoScrollSpeed);
  }

  autoScrollAnimation =
    requestAnimationFrame(runAutoScroll);
}

document.addEventListener("dragover", event => {

  const mouseY = event.clientY;
  const screenHeight = window.innerHeight;

  const scrollZone = 160;
  const maxSpeed = 18;

  /* Near top of screen */

  if (mouseY < scrollZone) {

    const strength =
      (scrollZone - mouseY) / scrollZone;

    autoScrollSpeed =
      -Math.max(
        3,
        Math.round(maxSpeed * strength)
      );

  }

  /* Near bottom of screen */

  else if (
    mouseY >
    screenHeight - scrollZone
  ) {

    const strength =
      (
        mouseY -
        (screenHeight - scrollZone)
      ) / scrollZone;

    autoScrollSpeed =
      Math.max(
        3,
        Math.round(maxSpeed * strength)
      );

  }

  /* Middle of screen */

  else {

    autoScrollSpeed = 0;

  }

});


document.addEventListener("dragend", () => {

  autoScrollSpeed = 0;

});


document.addEventListener("drop", () => {

  autoScrollSpeed = 0;

});


runAutoScroll();
/* =====================================================
   ACCOUNT + SAVE SYSTEM
===================================================== */

const emailInput =
  document.getElementById("emailInput");

const passwordInput =
  document.getElementById("passwordInput");

const signUpButton =
  document.getElementById("signUpButton");

const loginButton =
  document.getElementById("loginButton");

const logoutButton =
  document.getElementById("logoutButton");

const loggedOutArea =
  document.getElementById("loggedOutArea");

const loggedInArea =
  document.getElementById("loggedInArea");

const userEmail =
  document.getElementById("userEmail");

const authMessage =
  document.getElementById("authMessage");

const saveButton =
  document.getElementById("saveButton");

const saveMessage =
  document.getElementById("saveMessage");


/* -----------------------
   SHOW LOGIN STATUS
----------------------- */

async function updateLoginDisplay() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if (user) {

    loggedOutArea.style.display = "none";
    loggedInArea.style.display = "block";

    userEmail.textContent =
      user.email;

  } else {

    loggedOutArea.style.display = "block";
    loggedInArea.style.display = "none";

    userEmail.textContent = "";

  }

}


/* -----------------------
   SIGN UP
----------------------- */

signUpButton.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email || !password) {

      authMessage.textContent =
        "Enter an email and password first.";

      return;

    }


    authMessage.textContent =
      "Creating account...";


    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });


    if (error) {

      authMessage.textContent =
        error.message;

      return;

    }


    /*
      Because email confirmation is ON
      in Supabase, most new users will
      need to check their email first.
    */

    if (!data.session) {

      authMessage.textContent =
        "★ Account created! Check your email to confirm your account, then come back and log in. ★";

    } else {

      authMessage.textContent =
        "★ Account created! ★";

    }


    await updateLoginDisplay();

  }
);


/* -----------------------
   LOG IN
----------------------- */

loginButton.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email || !password) {

      authMessage.textContent =
        "Enter your email and password.";

      return;

    }


    authMessage.textContent =
      "Logging in...";


    const { error } =
      await supabaseClient.auth
        .signInWithPassword({
          email: email,
          password: password
        });


    if (error) {

      authMessage.textContent =
        error.message;

      return;

    }


    authMessage.textContent =
      "★ LOGGED IN ★";

    passwordInput.value = "";

    await updateLoginDisplay();

    await loadSavedPyramid();

  }
);


/* -----------------------
   LOG OUT
----------------------- */

logoutButton.addEventListener(
  "click",
  async () => {

    await supabaseClient.auth.signOut();

    authMessage.textContent =
      "Logged out.";

    saveMessage.textContent = "";

    await updateLoginDisplay();

  }
);


/* -----------------------
   SAVE PYRAMID
----------------------- */

saveButton.addEventListener(
  "click",
  async () => {

    saveMessage.textContent =
      "Saving...";


    /* Find logged-in user */

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

      saveMessage.textContent =
        "★ LOG IN OR SIGN UP TO SAVE YOUR PYRAMID ★";

      return;

    }


    /* Read every pyramid position */

    const rankingData = [];

    for (const slot of slots) {

      const card =
        slot.querySelector(".couple-card");


      if (!card) {

        saveMessage.textContent =
          "★ Rank all 14 couples before saving! ★";

        return;

      }


      rankingData.push({

        couple_id:
          Number(card.dataset.coupleId),

        position:
          Number(slot.dataset.rank)

      });

    }


    /*
      WEEK 1 FOR NOW.

      Later this will change depending
      on whichever week tab is selected.
    */

    const weekNumber = 1;


    /* Look for an existing Week 1 pyramid */

    const {
      data: existingPyramids,
      error: lookupError
    } =
      await supabaseClient
        .from("pyramids")
        .select("id")
        .eq("user_id", user.id)
        .eq("week_number", weekNumber)
        .limit(1);


    if (lookupError) {

      console.error(lookupError);

      saveMessage.textContent =
        "Could not save pyramid.";

      return;

    }


    let pyramidId;


    /*
      If they already saved Week 1,
      reuse the same pyramid.
    */

    if (
      existingPyramids &&
      existingPyramids.length > 0
    ) {

      pyramidId =
        existingPyramids[0].id;


      /*
        Remove the old ranking rows
        before inserting the new order.
      */

      const { error: deleteError } =
        await supabaseClient
          .from("rankings")
          .delete()
          .eq("pyramid_id", pyramidId);


      if (deleteError) {

        console.error(deleteError);

        saveMessage.textContent =
          "Could not update pyramid.";

        return;

      }

    }


    /*
      Otherwise create their Week 1
      pyramid for the first time.
    */

    else {

      const {
        data: newPyramid,
        error: pyramidError
      } =
        await supabaseClient
          .from("pyramids")
          .insert({

            user_id: user.id,
            week_number: weekNumber

          })
          .select("id")
          .single();


      if (pyramidError) {

        console.error(pyramidError);

        saveMessage.textContent =
          "Could not create pyramid.";

        return;

      }


      pyramidId =
        newPyramid.id;

    }


    /* Attach pyramid ID to all 14 rankings */

    const rowsToSave =
      rankingData.map(rank => ({

        pyramid_id: pyramidId,
        couple_id: rank.couple_id,
        position: rank.position

      }));


    const { error: rankingError } =
      await supabaseClient
        .from("rankings")
        .insert(rowsToSave);


    if (rankingError) {

      console.error(rankingError);

      saveMessage.textContent =
        "Could not save rankings.";

      return;

    }


    saveMessage.textContent =
      "★ PYRAMID SAVED! ★";

  }
);


/* -----------------------
   LOAD SAVED PYRAMID
----------------------- */

async function loadSavedPyramid() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if (!user) {
    return;
  }


  const weekNumber = 1;


  /* Find this user's Week 1 pyramid */

  const {
    data: pyramids,
    error: pyramidError
  } =
    await supabaseClient
      .from("pyramids")
      .select("id")
      .eq("user_id", user.id)
      .eq("week_number", weekNumber)
      .limit(1);


  if (
    pyramidError ||
    !pyramids ||
    pyramids.length === 0
  ) {

    return;

  }


  const pyramidId =
    pyramids[0].id;


  /* Get their saved rankings */

  const {
    data: savedRankings,
    error: rankingError
  } =
    await supabaseClient
      .from("rankings")
      .select("couple_id, position")
      .eq("pyramid_id", pyramidId)
      .order("position");


  if (rankingError) {

    console.error(rankingError);

    return;

  }


  /*
    Put each saved couple
    back into its saved slot.
  */

  savedRankings.forEach(rank => {

    const card =
      document.querySelector(
        `.couple-card[data-couple-id="${rank.couple_id}"]`
      );

    const slot =
      document.querySelector(
        `.rank-slot[data-rank="${rank.position}"]`
      );


    if (card && slot) {

      slot.appendChild(card);

    }

  });


  if (savedRankings.length > 0) {

    saveMessage.textContent =
      "★ YOUR SAVED WEEK 1 PYRAMID ★";

  }

}


/* -----------------------
   AUTH CHANGES
----------------------- */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    await updateLoginDisplay();

  }
);


/* -----------------------
   START ACCOUNT SYSTEM
----------------------- */

async function startAccountSystem() {

  await updateLoginDisplay();


  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if (user) {

    /*
      Give the couple cards a moment
      to finish loading before restoring
      their saved pyramid.
    */

    setTimeout(
      loadSavedPyramid,
      500
    );

  }

}


startAccountSystem();
</script>
</body>
</html>
